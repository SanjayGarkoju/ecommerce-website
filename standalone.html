<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere — Standalone Live E-Commerce Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f3ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
              },
            },
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
    <!-- React, ReactDOM, Babel, Lucide icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/history@5/umd/history.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-router@6/umd/react-router.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useContext, createContext, useMemo } = React;
      const { BrowserRouter, Routes, Route, Link, useNavigate, useSearchParams, useParams, useLocation } = ReactRouterDOM;

      // Inline Icons helper
      const Icon = ({ name, className = "w-5 h-5", ...props }) => {
        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [name]);
        return <i data-lucide={name} className={className} {...props}></i>;
      };

      // Toast Context
      const ToastContext = createContext();
      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([]);
        const showToast = (message, type = 'success') => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3000);
        };
        return (
          <ToastContext.Provider value={{ toasts, showToast }}>
            {children}
            <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm">
              {toasts.map((t) => (
                <div key={t.id} className="bg-slate-900 text-white p-4 rounded-xl shadow-xl border border-brand-500 text-xs font-semibold animate-bounce">
                  {t.type === 'success' ? '✓ ' : 'ℹ '}{t.message}
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        );
      };

      // Sample dataset (30 items)
      const PRODUCTS = [
        { id: 'prod-101', name: 'UltraBook Pro 15 M3 Laptop', category: 'Electronics', brand: 'Aether', price: 1299.99, originalPrice: 1599.99, discount: 18, rating: 4.9, reviewCount: 328, image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80', description: 'Powerful M3 Studio laptop for creators.', stock: 24, isFeatured: true, isBestSeller: true },
        { id: 'prod-102', name: 'SonicWave ANC Headphones', category: 'Electronics', brand: 'Acoustic Sound', price: 199.99, originalPrice: 279.99, discount: 28, rating: 4.8, reviewCount: 512, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80', description: 'Studio quality noise cancelling audio.', stock: 45, isFeatured: true, isBestSeller: true },
        { id: 'prod-103', name: 'FitPulse Smartwatch Series 7', category: 'Electronics', brand: 'Pulse Gear', price: 149.50, originalPrice: 199.00, discount: 25, rating: 4.6, reviewCount: 189, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80', description: 'Track workouts and health metrics.', stock: 60, isBestSeller: true },
        { id: 'prod-104', name: 'Vintage Denim Trucker Jacket', category: 'Fashion', brand: 'Urban Thread', price: 79.99, originalPrice: 119.99, discount: 33, rating: 4.7, reviewCount: 210, image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=800&q=80', description: 'Classic American heavy denim.', stock: 35, isFeatured: true },
        { id: 'prod-105', name: 'Air Runner Pro Sneakers', category: 'Shoes', brand: 'Velocity Kicks', price: 119.99, originalPrice: 159.99, discount: 25, rating: 4.8, reviewCount: 390, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80', description: 'High-rebound cushioning soles.', stock: 40, isFeatured: true, isBestSeller: true },
        { id: 'prod-106', name: 'AeroPolarized Aviator Sunglasses', category: 'Accessories', brand: 'Solstice', price: 69.99, originalPrice: 99.99, discount: 30, rating: 4.8, reviewCount: 275, image: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80', description: 'Ultra-lightweight titanium frame.', stock: 55, isBestSeller: true },
        { id: 'prod-107', name: 'Barista Pro Espresso Machine', category: 'Home & Kitchen', brand: 'AromaCraft', price: 449.99, originalPrice: 599.99, discount: 25, rating: 4.9, reviewCount: 240, image: 'https://images.unsplash.com/photo-1517668808822-9eaa03afd2af?auto=format&fit=crop&w=800&q=80', description: 'Craft cafe lattes at home.', stock: 14, isFeatured: true },
        { id: 'prod-108', name: 'Hyaluronic Acid Glow Serum', category: 'Beauty', brand: 'Lumiere', price: 38.00, originalPrice: 50.00, discount: 24, rating: 4.9, reviewCount: 480, image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=800&q=80', description: 'Deep hydration anti-aging formula.', stock: 100, isFeatured: true, isBestSeller: true },
        { id: 'prod-109', name: 'ProGrip Non-Slip Yoga Mat', category: 'Sports', brand: 'ZenFlow', price: 45.00, originalPrice: 65.00, discount: 30, rating: 4.9, reviewCount: 340, image: 'https://images.unsplash.com/photo-1601925260368-ae2f83cf8b7f?auto=format&fit=crop&w=800&q=80', description: 'Dual-sided non-slip eco rubber.', stock: 50, isFeatured: true }
      ];

      // Simple Main Component
      function StandaloneApp() {
        const [cart, setCart] = useState([]);
        const [wishlist, setWishlist] = useState([]);
        const { showToast } = useContext(ToastContext);

        const addToCart = (p) => {
          setCart((prev) => [...prev, p]);
          showToast(`Added "${p.name}" to cart!`);
        };

        const toggleWishlist = (p) => {
          if (wishlist.some((w) => w.id === p.id)) {
            setWishlist(wishlist.filter((w) => w.id !== p.id));
            showToast(`Removed from Wishlist`);
          } else {
            setWishlist([...wishlist, p]);
            showToast(`Saved to Wishlist!`);
          }
        };

        return (
          <div className="min-h-screen flex flex-col">
            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
              <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <Link to="/" className="flex items-center gap-2">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-extrabold text-lg">S</div>
                  <span className="text-xl font-extrabold text-slate-900">Shop<span className="text-brand-600">Sphere</span></span>
                </Link>
                <div className="flex items-center gap-4">
                  <Link to="/cart" className="relative p-2 text-slate-700 font-bold text-xs bg-slate-100 px-3 py-2 rounded-xl">
                    Cart ({cart.length})
                  </Link>
                  <Link to="/wishlist" className="p-2 text-rose-600 font-bold text-xs bg-rose-50 px-3 py-2 rounded-xl">
                    Wishlist ({wishlist.length})
                  </Link>
                </div>
              </div>
            </header>

            {/* Main */}
            <main className="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
              <Routes>
                <Route path="/" element={
                  <div className="space-y-8">
                    <div className="bg-gradient-to-r from-slate-900 via-brand-900 to-indigo-950 text-white p-10 rounded-3xl text-center space-y-4">
                      <span className="bg-brand-500/20 text-brand-300 text-xs font-bold px-3 py-1 rounded-full border border-brand-400/30">Next-Gen E-Commerce Platform</span>
                      <h1 className="text-4xl font-extrabold">ShopSphere Premium Catalog</h1>
                      <p className="text-slate-300 text-sm max-w-lg mx-auto">Explore top-tier electronics, fashion, footwear, smart home appliances and athletic gear.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                      {PRODUCTS.map((p) => (
                        <div key={p.id} className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex flex-col justify-between hover:shadow-lg transition-all">
                          <div>
                            <img src={p.image} alt={p.name} className="w-full aspect-square object-cover rounded-xl mb-3 bg-slate-50" />
                            <span className="text-[10px] font-bold uppercase text-brand-600 bg-brand-50 px-2 py-0.5 rounded">{p.category}</span>
                            <h3 className="text-base font-bold text-slate-900 mt-1">{p.name}</h3>
                            <p className="text-xs text-slate-500 mt-1">{p.description}</p>
                          </div>
                          <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span className="text-lg font-extrabold text-slate-900">${p.price}</span>
                            <button onClick={() => addToCart(p)} className="px-4 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md">
                              Add to Cart
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                } />
                <Route path="/cart" element={
                  <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h2 className="text-2xl font-bold">Shopping Cart ({cart.length} items)</h2>
                    {cart.length === 0 ? <p className="text-slate-500">Cart is empty.</p> : (
                      <div className="space-y-3">
                        {cart.map((item, idx) => (
                          <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                            <span className="font-bold text-xs">{item.name}</span>
                            <span className="font-extrabold text-sm">${item.price}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                } />
                <Route path="/wishlist" element={
                  <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <h2 className="text-2xl font-bold">Wishlist ({wishlist.length})</h2>
                  </div>
                } />
              </Routes>
            </main>

            <footer className="bg-slate-950 text-slate-400 py-6 text-center text-xs border-t border-slate-900">
              © {new Date().getFullYear()} ShopSphere Inc. Built with React.js & Tailwind CSS.
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <ToastProvider>
          <BrowserRouter>
            <StandaloneApp />
          </BrowserRouter>
        </ToastProvider>
      );
    </script>
  </body>
</html>
